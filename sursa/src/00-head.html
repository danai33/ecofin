<title>EcoFin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one iridescent silk field behind every screen; work happens on darker glass sheets.
   Each section = short title + second-level menu; the main tab shows only what is needed,
   explanations live in the section's "Ghid" tab. Phones get a bottom tab bar. */
:root{
  --ink:#ffffff;
  --ink-2:rgba(255,255,255,.92);
  --ink-3:rgba(255,255,255,.8);
  --line:rgba(255,255,255,.74);
  --line-2:rgba(255,255,255,.42);
  --line-3:rgba(255,255,255,.22);
  --veil:rgba(38,24,118,.38);
  --veil-2:rgba(30,18,100,.56);
  --veil-3:rgba(24,14,86,.72);
  --blue:#4f5ff0;
  --blue-2:#3f4de0;
  --violet:#8d6ef2;
  --pink:#ef6fc2;
  --sky:#8fdcff;
  --mint:#6cf2b9;
  --amber:#ffcf5c;
  --coral:#ff8f6b;
  --rose:#ff7a90;
  --exp:#ffa07f; --inc:#8fdcff; --sav:#6cf2b9;
  --bg:#7a7cf0;
  --scrim:rgba(20,10,64,.55);
  --shadow:0 34px 70px -34px rgba(30,14,100,.6);
  --f:'Comfortaa','Varela Round','Nunito',ui-rounded,system-ui,sans-serif;
  --r-lg:30px; --r-md:20px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(120% 80% at 10% 10%,#8a84fb 0%,transparent 55%),radial-gradient(90% 70% at 85% 80%,#f2706a 0%,transparent 55%),radial-gradient(80% 60% at 20% 60%,#f7a8c8 0%,transparent 60%),linear-gradient(160deg,#6f86fb,#b69cf4 45%,#8f8cf6);background-attachment:fixed;color:var(--ink);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--ink-3)}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:#fff;color:#2c2384;padding:10px 16px;border-radius:12px;font-weight:700}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(36,20,112,.36),rgba(36,20,112,.24) 60%,rgba(36,20,112,.3));opacity:0;transition:opacity .5s}
html.inner .veil{opacity:1}

/* ---------- glass & panels ---------- */
.glass{background:linear-gradient(145deg,rgba(255,255,255,.30),rgba(255,255,255,.08) 52%,rgba(255,255,255,.16));border:1px solid rgba(255,255,255,.62);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(150%);backdrop-filter:blur(24px) saturate(150%)}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04)),var(--veil);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:inset 0 1px 0 rgba(255,255,255,.26),var(--shadow);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}
.panel.deep{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02)),var(--veil-2)}
.pad{padding:22px 24px}
@media (max-width:560px){.pad{padding:18px 16px}}

/* ---------- controls ---------- */
.pill{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 20px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);font-weight:500;letter-spacing:.01em;white-space:nowrap;text-decoration:none;transition:background .2s,transform .2s,border-color .2s,box-shadow .2s}
.pill:hover{background:rgba(255,255,255,.2)}
.pill:active{transform:scale(.97)}
.pill.solid{background:var(--blue);border-color:rgba(255,255,255,.9)}
.pill.solid:hover{background:var(--blue-2)}
.pill.white{background:#fff;color:#2f2690;border-color:#fff;font-weight:700}
.pill.on{background:#fff;color:#2f2690;border-color:#fff}
.pill.sm{min-height:36px;padding:6px 14px;font-size:14px}
.pill.danger{border-color:rgba(255,150,170,.95)}
.pill.danger.confirm{background:var(--rose);border-color:#fff;color:#fff}
.pill[disabled]{opacity:.5;cursor:not-allowed}
.pill svg{width:18px;height:18px;flex:none}
.icon-btn{appearance:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:rgba(255,255,255,.08);flex:none;font-size:18px;line-height:1;transition:background .2s,border-color .2s}
.icon-btn:hover{background:rgba(255,255,255,.2);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px}
.chip{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;border:1px solid var(--line-2);background:rgba(255,255,255,.1);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s}
.chip:hover{background:rgba(255,255,255,.22)}
.chip.on{background:#fff;color:#2f2690;border-color:#fff}
.link{appearance:none;border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:rgba(255,255,255,.55);text-underline-offset:3px;color:inherit;cursor:pointer}
.link:hover{text-decoration-color:#fff}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink-3)}
.d-exp{background:var(--exp)}.d-inc{background:var(--inc)}.d-sav{background:var(--sav)}

/* labels that say where a number comes from */
.lbl{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;vertical-align:2px;line-height:1.4}
.lbl.calc{background:rgba(108,242,185,.2);border-color:rgba(108,242,185,.75)}
.lbl.user{background:rgba(143,220,255,.2);border-color:rgba(143,220,255,.8)}
.lbl.est{background:rgba(255,207,92,.2);border-color:rgba(255,207,92,.8)}
.lbl.hyp{background:rgba(190,170,255,.22);border-color:rgba(200,180,255,.8)}
.lbl.chk{background:rgba(255,122,144,.24);border-color:rgba(255,140,160,.85)}
.lbl.doc{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.8)}
.lbl.demo{background:rgba(255,207,92,.22);border-color:rgba(255,207,92,.9)}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2);font-weight:600;min-width:0}
.fld small{font-weight:500;color:var(--ink-3);font-size:12.5px}
.inp{appearance:none;width:100%;min-width:0;min-height:44px;font-size:16px;font-weight:600;color:#fff;background:rgba(16,8,70,.3);border:1.5px solid var(--line-2);border-radius:14px;padding:10px 14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.inp::placeholder{color:rgba(255,255,255,.62);font-weight:500}
.inp:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.2);background:rgba(16,8,70,.42)}
.inp[aria-invalid="true"]{border-color:#ffb3c0;box-shadow:0 0 0 3px rgba(255,122,144,.35)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
select.inp option{background:#3a2fa8;color:#fff}
.amt{position:relative;display:block}
.amt .inp{padding-right:52px}
.amt em{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--ink-3);font-size:14px;pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:8px;background:linear-gradient(90deg,#fff var(--p,50%),rgba(255,255,255,.28) var(--p,50%));outline:none;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:5px solid var(--blue);box-shadow:0 4px 14px rgba(30,10,100,.45);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--blue);cursor:pointer}
input[type=range]:focus-visible{outline:3px solid #fff;outline-offset:6px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;cursor:pointer;min-height:36px}
.check input{appearance:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none;cursor:pointer}
.check input:checked{background:#fff}
.check input:checked::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(-45deg) translate(1px,-1px)}
.switch{appearance:none;width:50px;height:30px;border-radius:999px;background:rgba(255,255,255,.2);border:1.5px solid var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch:checked{background:#2fbf83;border-color:#6cf2b9}
.switch:checked::after{transform:translateX(20px)}
.err{margin:0;font-size:14px;color:#fff;background:rgba(255,100,128,.32);border:1px solid rgba(255,140,160,.8);border-radius:12px;padding:8px 12px}
.note{font-size:14px;color:var(--ink-2);background:rgba(255,255,255,.08);border:1px solid var(--line-3);border-radius:14px;padding:10px 14px}
.seg{display:inline-flex;padding:4px;border-radius:999px;border:1.5px solid var(--line-2);background:rgba(255,255,255,.08)}
.seg button{appearance:none;border:0;background:none;min-height:38px;padding:7px 18px;border-radius:999px;font-weight:700;color:var(--ink-2);transition:background .2s,color .2s}
.seg button.on{background:#fff;color:#2f2690}

/* ---------- logo ---------- */
.logo{display:block;overflow:visible}
.logo .pc{transform-box:fill-box;transform-origin:50% 50%}
.logo .ring{fill:none;stroke:#fff;stroke-width:24}
.logo .bar{fill:#fff}
.logo-link{display:inline-block;line-height:0;text-decoration:none;border-radius:12px}

/* ---------- top bar ---------- */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
.topbar.off{transform:translateY(-110%);opacity:0;pointer-events:none}
.topbar-in{max-width:1320px;margin:10px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar-bar{display:flex;align-items:center;gap:12px;padding:7px 8px 7px 20px;border-radius:999px}
.topbar .logo{width:100px;height:auto}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:nowrap}
.nav .pill{min-height:40px;padding:6px 14px;font-size:14.5px;border-color:transparent;background:none}
.nav .pill:hover{background:rgba(255,255,255,.16)}
.nav .pill.on{background:#fff;color:#2f2690}
.acct{display:inline-flex;align-items:center;gap:8px}
.acct img{width:26px;height:26px;border-radius:50%;flex:none}
@media (max-width:1100px){.nav{display:none}.topbar .acct{margin-left:auto}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));display:none}
.tabbar nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px;border-radius:26px}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:6px 2px;border-radius:18px;font-size:11px;font-weight:700;color:var(--ink-2);min-width:0}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{background:#fff;color:#2f2690}
@media (max-width:1100px){.tabbar{display:block}}
.sheet{position:fixed;inset:0;z-index:85}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s both}
.sheet-box{position:absolute;left:0;right:0;bottom:0;border-radius:28px 28px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.05)),rgba(46,30,140,.95);border-top:1px solid var(--line-2);animation:sheetIn .35s cubic-bezier(.2,.8,.2,1) both}
.sheet-box::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:0 auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheet-grid button{appearance:none;display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border-radius:18px;border:1px solid var(--line-2);background:rgba(255,255,255,.08);text-align:left;font-weight:700}
.sheet-grid svg{width:24px;height:24px;flex:none}
@keyframes sheetIn{from{transform:translateY(60%)}}

/* ---------- views & page frame ---------- */
.view{min-height:100svh}
.page{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(98px + env(safe-area-inset-top,0px)) 120px}
@media (max-width:1100px){.page{padding-block:calc(84px + env(safe-area-inset-top,0px)) 130px}}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
.page-head h1{font-weight:300;font-size:clamp(28px,3.3vw,44px);line-height:1.08;letter-spacing:-.01em;margin-top:6px;text-shadow:0 2px 24px rgba(40,20,120,.35)}
.subnav{display:flex;gap:4px;padding:5px;border-radius:999px;border:1.5px solid var(--line-2);background:rgba(30,18,100,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:22px}
.subnav::-webkit-scrollbar{display:none}
.subnav button{appearance:none;border:0;background:none;min-height:40px;padding:7px clamp(12px,2.4vw,18px);border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-2);white-space:nowrap;transition:background .2s,color .2s}
.subnav button:hover{background:rgba(255,255,255,.14)}
.subnav button.on{background:#fff;color:#2f2690}
.subnav-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.pane{animation:paneIn .3s ease-out backwards}
@keyframes paneIn{from{opacity:.6;transform:translateY(8px)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack-gap{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.empty{padding:34px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-weight:400;font-size:clamp(22px,2.6vw,30px)}
.empty p{max-width:52ch;color:var(--ink-2)}

/* guide pages */
.guide{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1000px){.guide{grid-template-columns:minmax(0,1fr)}}
.guide article{padding:26px 28px;max-width:none}
.guide article>*+*{margin-top:12px}
.guide h2{font-size:24px;font-weight:600;margin-top:26px}
.guide h2:first-child{margin-top:0}
.guide h3{font-size:18px;font-weight:700;margin-top:18px}
.guide p,.guide li{max-width:68ch;color:var(--ink-2)}
.guide ul,.guide ol{padding-left:22px;margin:8px 0}
.guide li+li{margin-top:6px}
.guide dl{display:grid;gap:10px;margin:10px 0}
.guide dt{font-weight:700}
.guide dd{margin:2px 0 0;color:var(--ink-2);max-width:68ch}
.formula{font-variant-numeric:tabular-nums;background:rgba(10,4,50,.35);border:1px solid var(--line-3);border-radius:14px;padding:12px 16px;font-size:15px;overflow-x:auto;white-space:nowrap}
.guide aside{padding:20px;position:sticky;top:96px;display:grid;gap:10px}
.guide aside h3{margin:0;font-size:16px}
.toc{display:grid;gap:4px}
.toc button{appearance:none;text-align:left;background:none;border:0;padding:8px 10px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.toc button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ---------- HERO ---------- */
.hero{position:relative;height:max(620px,min(100svh,62vw));min-height:560px;overflow:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-logo{position:absolute;left:4.5%;top:5.6%;width:clamp(170px,21.5vw,400px);z-index:5}
.hero-logo .logo{width:100%;height:auto}
.hand-stage{position:absolute;left:0;top:0;bottom:0;width:54%;z-index:3;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 100%);mask-image:linear-gradient(to bottom,#000 86%,transparent 100%)}
.hand-rig{position:absolute;left:30%;top:20%;width:30%;height:80%}
.hand-move,.hand-float{position:absolute;inset:0;transform-origin:50% 100%}
.hand-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;opacity:0;transition:opacity .8s ease;filter:drop-shadow(0 26px 34px rgba(40,20,120,.2))}
.hand-stage.shown .hand-img{opacity:1}
/* the moment before the opening starts (the coin is being set up): logo, hand and card wait off-stage */
.pre-intro #heroLogo,.pre-intro .hand-stage,.pre-intro .hero-card-wrap{opacity:0}
#coinCanvas{position:absolute;display:block;opacity:0;transition:opacity .6s}
.hand-stage.ready #coinCanvas{opacity:1}
.fb-coin{position:absolute;display:grid;place-items:center;perspective:600px}
.fb-coin img{grid-area:1/1;width:var(--d,100px);height:var(--d,100px);border-radius:50%;backface-visibility:hidden;animation:coinSpin 5s linear infinite}
.fb-coin img+img{animation-name:coinSpinB}
@keyframes coinSpinB{from{transform:rotateY(180deg)}to{transform:rotateY(540deg)}}
.hero-card-wrap{position:absolute;left:52.6%;right:6.5%;top:16.6%;bottom:4%;z-index:4;perspective:1400px}
.hero-card{position:relative;height:100%;border-radius:clamp(30px,3.4vw,56px);padding:clamp(18px,2.4vw,44px) clamp(18px,2.2vw,40px);display:flex;flex-direction:column;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.intro .hero-card{animation:cardIn 1.4s cubic-bezier(.16,1,.3,1) 1.1s both}
/* the home card: one clear pane of glass (no side panels), lighter blur so the silk shows through */
.hero-card.glass{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05) 52%,rgba(255,255,255,.1));border-color:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(11px) saturate(135%);backdrop-filter:blur(11px) saturate(135%)}
.hero-card h1,.hero-card .pill{text-shadow:0 1px 14px rgba(50,20,130,.35)}
@keyframes cardIn{from{opacity:0;translate:60px 0;rotate:y -22deg;scale:.96}to{opacity:1;translate:0 0;rotate:y 0deg;scale:1}}
.hero-tabs{display:flex;gap:clamp(5px,.55vw,12px);flex-wrap:nowrap}
.hero-tabs .pill{font-size:clamp(11px,.85vw,15px);min-height:clamp(34px,2.6vw,46px);padding:4px clamp(6px,.8vw,18px);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1180px){.hero-tabs{flex-wrap:wrap}.hero-tabs .pill{font-size:13px;padding:6px 14px;overflow:visible}}
.hero h1{font-weight:300;font-size:clamp(34px,4.35vw,82px);line-height:1.13;letter-spacing:.003em;margin:clamp(22px,3.6vw,64px) 0 0 clamp(4px,.8vw,14px);text-shadow:0 2px 30px rgba(60,20,140,.3)}
.intro .hero h1 .w{display:inline-block;animation:wordIn 1s cubic-bezier(.16,1,.3,1) both}
@keyframes wordIn{from{opacity:0;transform:translateY(.5em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.2vw,20px);margin-top:auto}

.mode-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;padding:14px 18px;border-radius:22px;margin-bottom:16px}
.mode-bar.demo{background:linear-gradient(120deg,rgba(255,207,92,.24),rgba(255,143,200,.16));border:1px solid rgba(255,207,92,.78)}
.mode-bar.own{padding:4px 2px;margin-bottom:12px}
.mode-bar.own p{margin:0;font-size:14px}
.mode-txt{display:flex;align-items:flex-start;gap:12px;flex:1 1 340px;min-width:0}
.mode-txt p{margin:0;font-size:16.5px;line-height:1.45}
.mode-txt .lbl{flex:none;margin-top:3px}
.mode-btns{display:flex;flex-wrap:wrap;gap:10px}
.pill.big{min-height:52px;padding:10px 26px;font-size:17px;font-weight:700}
.cr-mode button{display:inline-flex;align-items:center;gap:6px}
.cr-plus.end.try button{border-style:solid;width:172px;background:linear-gradient(160deg,rgba(91,108,246,.9),rgba(141,110,242,.88));color:#fff}
.cr-plus.end.try button b{display:grid;place-items:center}
.cr-plus.end.try button small{font-size:12.5px;font-weight:500;opacity:.92}
.cr-plus.end.try button:hover{background:linear-gradient(160deg,#5b6cf6,#8d6ef2)}
@media (max-width:560px){.mode-btns{width:100%}.mode-btns .pill{flex:1 1 auto}}
/* accounting */
.money-strip{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}

.money-strip .kpi.hi.bad{background:rgba(255,122,144,.2);border-color:rgba(255,150,170,.75)}
.kpi-v.big{font-size:clamp(30px,3.6vw,44px);line-height:1.1}
.kpi .lbl{margin-left:4px}
.modal .kpi-v{font-size:clamp(18px,2vw,24px)}
@media (max-width:760px){.money-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.money-strip .kpi.hi{grid-column:1/-1}}
.e-cat{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.16);margin-left:4px;white-space:nowrap}
.chip small{font-weight:600;opacity:.82;margin-left:2px;font-size:12px}
.chip.on small{opacity:1}
.where{margin:0 0 16px;font-size:16px;max-width:none}
.bud-group+.bud-group{margin-top:18px}
.bud-group .sec-head{margin-bottom:8px}
.bud-group h3{font-size:17px;font-weight:700;margin:0}
.bud-row .v .muted{font-weight:600}
/* planner */
.res-lines{display:grid;gap:6px}
.plan-row.ex input[data-k="amount"],.plan-row.ex #plFund{border-style:dashed;border-color:rgba(255,207,92,.95)}
.plan-group h3{margin:0}
.ue-steps{margin:10px 0;padding-left:22px;display:grid;gap:8px}
.ue-time{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 6px}
.ue-time i{width:22px;height:22px;border-radius:7px}
.ue-time i.pay{background:var(--coral)}
.ue-time i.fund{background:var(--sky)}
.result .hl{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.result .hl{grid-template-columns:minmax(0,1fr)}}
/* savings */
.ch-days-pick{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.ch-mood{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 14px;border-radius:18px;background:#fff;color:#2c2384;font-weight:700;font-size:15px}
.ch-mood p{margin:0}
.mood-bubble{pointer-events:none}
.advice p{margin:0}
/* contracts */
.consent{margin:0 0 14px}
.consent p{margin:0 0 10px}
.lbl.pref{appearance:none;font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;cursor:pointer;margin:0 2px}
.lbl.pref:hover{background:#fff;color:#2c2384}
.drop{cursor:pointer}
.drop:focus-visible{outline:3px solid #fff;outline-offset:4px}
.privacy{align-items:flex-start}

.auth-go{justify-self:start;min-width:180px}

.legal{max-width:66ch;display:grid;gap:6px}

.legal p,.legal li{color:var(--ink-2);line-height:1.55;margin:0}

.legal a{color:#fff}
.foot-links{white-space:nowrap}
